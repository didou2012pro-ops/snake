name: Build iOS IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          mkdir -p $THEOS/sdks
          curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS10.3.sdk.tar.xz
          tar -xf iPhoneOS10.3.sdk.tar.xz -C $THEOS/sdks
      - name: Build
        run: |
          export THEOS=/opt/theos
          make SDKVERSION=10.3
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Snake-IPA
          path: packages/*.ipa
